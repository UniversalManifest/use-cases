<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">Peer participants and roles for each claim</title>
  <desc id="desc">Visitor sends authorized age-threshold evidence to Museum. Visitor is Subject and Holder for that claim, and Museum is Verifier. Museum sends operating evidence to Visitor, reversing those roles for that claim. An Issuer can be another party or the Subject itself; the latter is self-issued. The recipient checks the claimed Issuer's evidence. Data, Facet, Credential and Receipt are associated objects. Both peers authenticate, decide disclosure and retain their own minimal records.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#111" stroke-width="1.6"/></marker>
    <style>text{font-family:Helvetica,Arial,sans-serif;fill:#111;text-anchor:middle} .title{font-size:24px;font-weight:bold}.heading{font-size:20px;font-weight:bold}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.box{fill:white;stroke:#111;stroke-width:1.5}.line{fill:none;stroke:#111;stroke-width:1.6}</style>
  </defs>
  <rect width="900" height="640" fill="white"/>
  <text x="450" y="34" class="title">Roles follow each claim</text>
  <text x="450" y="58" class="small">Two peer Entities: each requests and presents information</text>
  <rect x="50" y="85" width="250" height="78" class="box"/>
  <text x="175" y="116" class="heading">Visitor</text>
  <text x="175" y="142" class="small">Controls its information</text>
  <rect x="600" y="85" width="250" height="78" class="box"/>
  <text x="725" y="116" class="heading">Museum</text>
  <text x="725" y="142" class="small">Controls exhibition access</text>
  <path d="M175 163 V365 M725 163 V365" class="line" stroke-dasharray="5 5"/>
  <text x="450" y="204" class="label">Authorized age-threshold evidence</text>
  <path d="M175 227 H725" class="line" marker-end="url(#arrow)"/>
  <text x="450" y="257" class="small">Subject + Holder: Visitor / Verifier: Museum</text>
  <text x="450" y="306" class="label">Authorized operating evidence</text>
  <path d="M725 329 H175" class="line" marker-end="url(#arrow)"/>
  <text x="450" y="359" class="small">Subject + Holder: Museum / Verifier: Visitor</text>
  <rect x="135" y="390" width="630" height="68" class="box"/>
  <text x="450" y="418" class="label">Issuer: another party, or the Subject itself (self-issued)</text>
  <text x="450" y="442" class="small">The recipient checks the claimed Issuer's evidence.</text>
  <rect x="35" y="488" width="830" height="108" class="box"/>
  <text x="450" y="512" class="small">Objects used under UM's disclosure and permission rules</text>
  <rect x="50" y="528" width="185" height="49" class="box"/>
  <rect x="255" y="528" width="185" height="49" class="box"/>
  <rect x="460" y="528" width="185" height="49" class="box"/>
  <rect x="665" y="528" width="185" height="49" class="box"/>
  <text x="142.5" y="549" class="label">Data</text>
  <text x="142.5" y="568" class="tiny">Information held</text>
  <text x="347.5" y="549" class="label">Facet</text>
  <text x="347.5" y="568" class="tiny">A portion for a purpose</text>
  <text x="552.5" y="549" class="label">Credential</text>
  <text x="552.5" y="568" class="tiny">An Issuer's claims</text>
  <text x="757.5" y="549" class="label">Receipt</text>
  <text x="757.5" y="568" class="tiny">Checks and decisions</text>
  <text x="450" y="624" class="small">Both peers authenticate, decide disclosure and keep their own minimal Receipt.</text>
</svg>
