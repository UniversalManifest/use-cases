<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Later access and a copy already delivered</title>
  <desc id="desc">Access at the controlled source: Later access under the withdrawn Grant is rejected. A copy already delivered: Withdrawal cannot retrieve or erase the copy. Further use or retention under that Grant is unauthorized.</desc>
  <defs>
    <style>text{font-family:Helvetica,Arial,sans-serif;fill:#111;text-anchor:middle}.title{font-size:24px;font-weight:bold}.heading{font-size:20px;font-weight:bold}.label{font-size:17px}.small{font-size:15px}.box{fill:white;stroke:#111;stroke-width:1.5}</style>
  </defs>
  <rect width="900" height="250" fill="white"/>
  <text x="450" y="34" class="title">Later withdrawal</text>
  <rect x="25" y="65" width="410" height="160" class="box"/>
  <rect x="465" y="65" width="410" height="160" class="box"/>
  <text x="230" y="100" class="heading">Access at the controlled source</text>
  <text x="230" y="145" class="label">Later access under the withdrawn</text>
  <text x="230" y="170" class="label">Grant is rejected.</text>
  <text x="670" y="100" class="heading">A copy already delivered</text>
  <text x="670" y="135" class="label">Withdrawal cannot retrieve or erase the copy.</text>
  <text x="670" y="170" class="label">Further use or retention under that Grant</text>
  <text x="670" y="195" class="label">is unauthorized.</text>
</svg>
